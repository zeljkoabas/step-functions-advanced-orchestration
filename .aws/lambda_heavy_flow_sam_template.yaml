AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Meetup demo - intentionally Lambda-heavy Step Functions workflow

Globals:
  Function:
    Runtime: python3.12
    Handler: lambda_function.lambda_handler
    Timeout: 10
    MemorySize: 128
    Tracing: Active

Resources:

  TransformInputFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: transform-input-demo
      CodeUri: ../../lambda_heavy_flow/lambda/transform_input/
      Policies:
        - AWSLambdaBasicExecutionRole

  ValidateDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: validate-data-demo
      CodeUri: ../../lambda_heavy_flow/lambda/validate_data/
      Policies:
        - AWSLambdaBasicExecutionRole

  EnrichPayloadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: enrich-payload-demo
      CodeUri: ../../lambda_heavy_flow/lambda/enrich_payload/
      Policies:
        - AWSLambdaBasicExecutionRole

  BuildApiRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: build-api-request-demo
      CodeUri: ../../lambda_heavy_flow/lambda/build_api_request/
      Policies:
        - AWSLambdaBasicExecutionRole

  GetBearerTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: get-bearer-token-demo
      CodeUri: ../../lambda_heavy_flow/lambda/get_bearer_token/
      Policies:
        - AWSLambdaBasicExecutionRole

  CallExternalApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: call-external-api-demo
      CodeUri: ../../lambda_heavy_flow/lambda/call_external_api/
      Policies:
        - AWSLambdaBasicExecutionRole

  PersistResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: persist-result-demo
      CodeUri: ../../lambda_heavy_flow/lambda/persist_result/
      Policies:
        - AWSLambdaBasicExecutionRole

  LambdaHeavyFlowStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Role: !GetAtt LambdaHeavyFlowStateMachineRole.Arn
      Name: lambda-heavy-flow-demo
      Type: STANDARD
      DefinitionUri: ../../lambda_heavy_flow/step_function/function.asl.json
      DefinitionSubstitutions:
        TransformInputFunctionArn: !GetAtt TransformInputFunction.Arn
        ValidateDataFunctionArn: !GetAtt ValidateDataFunction.Arn
        EnrichPayloadFunctionArn: !GetAtt EnrichPayloadFunction.Arn
        BuildApiRequestFunctionArn: !GetAtt BuildApiRequestFunction.Arn
        GetBearerTokenFunctionArn: !GetAtt GetBearerTokenFunction.Arn
        CallExternalApiFunctionArn: !GetAtt CallExternalApiFunction.Arn
        PersistResultFunctionArn: !GetAtt PersistResultFunction.Arn
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt LambdaHeavyFlowLogGroup.Arn
        IncludeExecutionData: true
        Level: ALL
      Tracing:
        Enabled: true
  
  LambdaHeavyFlowStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: lambda-heavy-flow-stepfunctions-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsLoggingPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"

        - PolicyName: StepFunctionsInvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: "*"

  LambdaHeavyFlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/states/lambda-heavy-flow-demo
      RetentionInDays: 7

Outputs:
  StateMachineArn:
    Description: ARN of the Lambda-heavy demo state machine
    Value: !Ref LambdaHeavyFlowStateMachine

  StateMachineName:
    Description: Name of the Lambda-heavy demo state machine
    Value: lambda-heavy-flow-demo

  TransformInputFunctionArn:
    Value: !GetAtt TransformInputFunction.Arn

  ValidateDataFunctionArn:
    Value: !GetAtt ValidateDataFunction.Arn

  EnrichPayloadFunctionArn:
    Value: !GetAtt EnrichPayloadFunction.Arn

  BuildApiRequestFunctionArn:
    Value: !GetAtt BuildApiRequestFunction.Arn

  GetBearerTokenFunctionArn:
    Value: !GetAtt GetBearerTokenFunction.Arn

  CallExternalApiFunctionArn:
    Value: !GetAtt CallExternalApiFunction.Arn

  PersistResultFunctionArn:
    Value: !GetAtt PersistResultFunction.Arn