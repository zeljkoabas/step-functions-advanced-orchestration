AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Step Functions workflow that fetches users from dummyjson,
  aggregates them, and stores aggregates in DynamoDB.

Parameters:
  StateMachineName:
    Type: String
    Default: user-aggregates-workflow
  
  ConnectionArn:
    Type: String
    Description: ARN of the EventBridge API Destination connection to invoke the JSONata Transform API

Resources:
  UserAggregatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: user-aggregates
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: UserAggregates

  UserAggregatesStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${StateMachineName}-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeDummyJsonLoggingPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"
        - PolicyName: InvokeDummyJsonHttpEndpointPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:RetrieveConnectionCredentials
                  - events:DescribeConnection
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:connection/*
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:events!connection/*
        - PolicyName: InvokeDummyJsonInvokeHttpEndpointPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:InvokeHTTPEndpoint
                Resource: "*"
        - PolicyName: InvokeDummyJsonDynamoDbWritePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt UserAggregatesTable.Arn

  UserAggregatesStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Ref StateMachineName
      Type: STANDARD
      Role: !GetAtt UserAggregatesStateMachineRole.Arn
      DefinitionUri: ../../jsonata_transform/users_aggregate/function.asl.json
      DefinitionSubstitutions:
        ConnectionArn: !Ref ConnectionArn

Outputs:
  StateMachineArn:
    Description: ARN of the Step Functions state machine
    Value: !Ref UserAggregatesStateMachine

  UserAggregatesTableName:
    Description: Name of the DynamoDB table
    Value: !Ref UserAggregatesTable

  StateMachineRoleArn:
    Description: IAM role used by Step Functions
    Value: !GetAtt UserAggregatesStateMachineRole.Arn