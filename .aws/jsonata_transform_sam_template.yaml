AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Meetup demo - JSONata Transform Step Functions workflow

Parameters:
  ConnectionArn:
    Type: String
    Description: ARN of the EventBridge API Destination connection to invoke the JSONata Transform API

Resources:
  jsonataTransformStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Role: !GetAtt JsonataTransformStateMachineRole.Arn
      Name: jsonata-transform-demo
      Type: STANDARD
      DefinitionUri: ../jsonata_step_function/jsonata_transform_function.asl.json
      DefinitionSubstitutions:
        ConnectionArn: !Ref ConnectionArn
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt JsonataTransformLogGroup.Arn
        IncludeExecutionData: true
        Level: ALL
      Tracing:
        Enabled: true
  
  JsonataTransformStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: jsonata-transform-stepfunctions-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsLoggingPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"
        - PolicyName: StepFunctionsHttpEndpointPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:RetrieveConnectionCredentials
                  - events:DescribeConnection
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:connection/*
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:events!connection/*
        - PolicyName: StepFunctionsInvokeHttpEndpointPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:InvokeHTTPEndpoint
                Resource: "*"
        - PolicyName: StepFunctionsDynamoDbWritePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt MeetupDemoResultsTable.Arn

  JsonataTransformLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/states/jsonata-transform-demo
      RetentionInDays: 7
  
  MeetupDemoResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: meetup-demo-results
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  StateMachineArn:
    Description: ARN of the Jsonata Transform demo state machine
    Value: !Ref jsonataTransformStateMachine

  StateMachineName:
    Description: Name of the Jsonata Transform demo state machine
    Value: jsonata-transform-demo
